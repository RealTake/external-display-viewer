name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    name: Build notarized macOS release
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify release tag
        run: Scripts/build-distribution.sh --verify-tag "${GITHUB_REF_NAME}"

      - name: Import Developer ID certificate
        env:
          DEVELOPER_ID_APPLICATION_P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          DEVELOPER_ID_APPLICATION_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
        run: |
          set -euo pipefail
          : "${DEVELOPER_ID_APPLICATION_P12_BASE64:?Missing DEVELOPER_ID_APPLICATION_P12_BASE64 secret}"
          : "${DEVELOPER_ID_APPLICATION_P12_PASSWORD:?Missing DEVELOPER_ID_APPLICATION_P12_PASSWORD secret}"

          keychain_path="$RUNNER_TEMP/release-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          echo "::add-mask::$keychain_password"
          printf 'RELEASE_KEYCHAIN_PATH=%s\n' "$keychain_path" >> "$GITHUB_ENV"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          printf '%s' "$DEVELOPER_ID_APPLICATION_P12_BASE64" | base64 --decode > "$certificate_path"
          chmod 600 "$certificate_path"
          security import "$certificate_path" -k "$keychain_path" -P "$DEVELOPER_ID_APPLICATION_P12_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain_path"
          rm -f "$certificate_path"

      - name: Store notarization credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          : "${APPLE_ID:?Missing APPLE_ID secret}"
          : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID secret}"
          : "${APPLE_APP_SPECIFIC_PASSWORD:?Missing APPLE_APP_SPECIFIC_PASSWORD secret}"
          xcrun notarytool store-credentials release-notary \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --keychain "$RELEASE_KEYCHAIN_PATH"

      - name: Build notarized archive
        env:
          EXTERNAL_DISPLAY_VIEWER_NOTARY_PROFILE: release-notary
        run: |
          set -euo pipefail
          : "${RELEASE_KEYCHAIN_PATH:?Release keychain was not initialized}"
          export EXTERNAL_DISPLAY_VIEWER_NOTARY_KEYCHAIN="$RELEASE_KEYCHAIN_PATH"
          Scripts/build-distribution.sh --output-dir build/distribution

      - name: Prepare release metadata
        run: |
          set -euo pipefail
          archive_name="$(Scripts/build-distribution.sh --print-metadata | awk -F= '$1 == "archive" { print $2 }')"
          test -n "$archive_name"
          archive_path="build/distribution/$archive_name"
          checksum_path="$archive_path.sha256"
          cask_path="build/distribution/external-display-viewer.rb"
          checksum="$(shasum -a 256 "$archive_path" | awk '{ print $1 }')"
          printf '%s  %s\n' "$checksum" "$archive_name" > "$checksum_path"
          Scripts/render-homebrew-cask.sh --sha256 "$checksum" > "$cask_path"
          printf 'RELEASE_ARCHIVE_PATH=%s\n' "$archive_path" >> "$GITHUB_ENV"
          printf 'RELEASE_CHECKSUM_PATH=%s\n' "$checksum_path" >> "$GITHUB_ENV"
          printf 'RELEASE_CASK_PATH=%s\n' "$cask_path" >> "$GITHUB_ENV"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            "$RELEASE_ARCHIVE_PATH" \
            "$RELEASE_CHECKSUM_PATH" \
            "$RELEASE_CASK_PATH" \
            --title "${GITHUB_REF_NAME}" \
            --notes "Notarized macOS arm64 build for ExternalDisplayViewer."

      - name: Clean temporary keychain
        if: always()
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/developer-id-application.p12"
          if [[ -n "${RELEASE_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$RELEASE_KEYCHAIN_PATH" || true
            rm -f "$RELEASE_KEYCHAIN_PATH"
          fi
